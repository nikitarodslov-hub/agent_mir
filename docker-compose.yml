version: '3.8'

services:
  # PostgreSQL для метаданных
  postgres:
    image: postgres:15-alpine
    container_name: family_roots_postgres
    environment:
      POSTGRES_DB: family_roots
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j для графовой БД
  neo4j:
    image: neo4j:5.14-community
    container_name: family_roots_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/var/lib/neo4j/data
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для кеша
  redis:
    image: redis:7-alpine
    container_name: family_roots_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family_roots_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/family_roots
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URL: redis://redis:6379
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      VK_TOKEN: ${VK_TOKEN:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - family_roots

  # React frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: family_roots_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
    networks:
      - family_roots

  # Telegram бот
  telegram_bot:
    build:
      context: ./bots/telegram_bot
      dockerfile: Dockerfile
    container_name: family_roots_telegram_bot
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - family_roots

  # VK бот
  vk_bot:
    build:
      context: ./bots/vk_bot
      dockerfile: Dockerfile
    container_name: family_roots_vk_bot
    environment:
      VK_TOKEN: ${VK_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - family_roots

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: family_roots_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - family_roots

volumes:
  postgres_data:
  neo4j_data:
  redis_data:

networks:
  family_roots:
    driver: bridge
